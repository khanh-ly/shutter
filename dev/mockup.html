<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shutter mockup</title>
<!--
  A screenshot from docs/screenshots on a Frame-style TV (a picture-frame bezel in teak,
  hung flush on the wall), for the README. Drawn in CSS, not a Samsung product image.
  dev/screenshots.sh renders it with headless Chrome: mockup.html?shot=albums
-->
<style>
  html, body { margin: 0; height: 100%; }
  body {
    /* A softly lit plaster wall: warm light from the top left. */
    background:
      radial-gradient(ellipse 85% 75% at 28% 18%, #f4f0ea 0%, #e6dfd6 55%, #d2c9be 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* The TV, in the proportions of a 55" The Frame: 1237.9 x 708.8 mm overall around a
     54.6" 16:9 panel (about 1208.8 x 680 mm), so a 14.5 mm bezel. With the screen drawn
     1280px wide that's 15px, and 1310 x 750px overall (1.747:1, as the real thing).
     Hung flush, so only a tight, soft shadow. */
  .tv {
    --bezel: 15px;
    position: relative;
    width: 1280px;
    height: 720px;
    padding: var(--bezel);
    box-shadow:
      0 2px 3px rgba(60, 40, 20, 0.25),
      0 22px 40px -12px rgba(60, 40, 20, 0.4),
      0 60px 90px -40px rgba(60, 40, 20, 0.35);
  }

  /* Four mitred pieces of teak; grain runs along each piece. */
  .wood { position: absolute; }
  .wood::before, .wood::after { content: ''; position: absolute; inset: 0; }
  .top, .bottom { left: 0; right: 0; height: var(--bezel); }
  .left, .right { top: 0; bottom: 0; width: var(--bezel); }
  .top { top: 0; clip-path: polygon(0 0, 100% 0, calc(100% - var(--bezel)) 100%, var(--bezel) 100%); }
  .bottom { bottom: 0; clip-path: polygon(var(--bezel) 0, calc(100% - var(--bezel)) 0, 100% 100%, 0 100%); }
  .left { left: 0; clip-path: polygon(0 0, 100% var(--bezel), 100% calc(100% - var(--bezel)), 0 100%); }
  .right { right: 0; clip-path: polygon(0 var(--bezel), 100% 0, 100% 100%, 0 calc(100% - var(--bezel))); }

  .top, .bottom {
    background:
      repeating-linear-gradient(0deg, rgba(70, 38, 16, 0.10) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(1.2deg, rgba(255, 220, 170, 0.08) 0 2px, transparent 2px 9px),
      linear-gradient(90deg, #a46a3c, #b57a49 20%, #9c6236 45%, #b0743f 70%, #a26838);
  }
  .left, .right {
    background:
      repeating-linear-gradient(90deg, rgba(70, 38, 16, 0.10) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(91.2deg, rgba(255, 220, 170, 0.08) 0 2px, transparent 2px 9px),
      linear-gradient(180deg, #a66b3d, #9b6135 30%, #b37848 60%, #a0663a);
  }
  /* Light from the top left: lit top and left pieces, shaded bottom and right, and a
     narrow bevel on the inner edge. */
  .top::after { background: linear-gradient(180deg, rgba(255, 240, 220, 0.28), rgba(0, 0, 0, 0.12)); }
  .left::after { background: linear-gradient(90deg, rgba(255, 240, 220, 0.2), rgba(0, 0, 0, 0.14)); }
  .bottom::after { background: linear-gradient(0deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.08)); }
  .right::after { background: linear-gradient(270deg, rgba(0, 0, 0, 0.26), rgba(0, 0, 0, 0.08)); }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    /* The panel's own thin black edge, inside the frame. */
    box-shadow: 0 0 0 2px #0b0b0c, inset 0 0 0 1px rgba(255, 255, 255, 0.04);
  }
  .screen img { display: block; width: 100%; height: 100%; }
  /* The Frame's matte panel: only the faintest sheen. */
  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(118deg, rgba(255, 255, 255, 0.045) 0%, rgba(255, 255, 255, 0) 40%);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="tv">
    <div class="wood top"></div><div class="wood bottom"></div>
    <div class="wood left"></div><div class="wood right"></div>
    <div class="screen"><img id="shot" alt=""></div>
  </div>
  <script>
    var name = (location.search.match(/shot=(\w+)/) || [])[1] || 'slideshow';
    document.getElementById('shot').src = '../docs/screenshots/' + name + '.png';
  </script>
</body>
</html>
